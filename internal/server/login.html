<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <title>sshwebdoor Access</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
        body { font-family: system-ui, sans-serif; background: #0f172a; color: #e2e8f0; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0; }
        .card { background: rgba(15, 23, 42, 0.85); border-radius: 12px; padding: 2.5rem; box-shadow: 0 25px 50px -12px rgba(15, 23, 42, 0.65); width: min(420px, 90vw); }
        h1 { margin-top: 0; }
        label { display: block; margin-bottom: 0.5rem; }
        input[type="password"] { width: 100%; padding: 0.75rem; border-radius: 8px; border: none; margin-bottom: 1rem; font-size: 1rem; }
        button { background: #38bdf8; color: #0f172a; border: none; padding: 0.75rem 1.5rem; border-radius: 8px; font-size: 1rem; cursor: pointer; }
        .status { margin-top: 1rem; font-size: 0.9rem; }
        .error { color: #fca5a5; }
        .success { color: #bbf7d0; }
    </style>
</head>
<body>
    <div class="card">
        <h1>Secure Access</h1>
        <p>Provide the passphrase to continue.</p>
        {{if .Locked}}
            <p class="error">Too many failed attempts. Try again in {{.LockoutRemaining}} seconds.</p>
        {{else}}
        <form method="post" action="/login">
            <label for="password">Password</label>
            <input id="password" name="password" type="password" autocomplete="off" autofocus required />
            <button type="submit">Submit</button>
        </form>
        {{if .Message}}
            <div class="status {{.MessageClass}}">{{.Message}}</div>
        {{end}}
        <p class="status">Attempts remaining: {{.AttemptsRemaining}}</p>
        {{end}}
    </div>
</body>
</html>
